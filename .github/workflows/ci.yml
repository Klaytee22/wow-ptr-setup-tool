name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is where this tool runs, so it leads the matrix. Linux is there to
    # keep the module honest about being front-end-free.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Test (PowerShell 7)
        shell: pwsh
        run: ./tests/Invoke-Tests.ps1

  test-windows-powershell:
    # The double-click launcher runs Windows PowerShell 5.1, which is a
    # different runtime with different gaps — it gets its own run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Test (Windows PowerShell 5.1)
        shell: powershell
        run: ./tests/Invoke-Tests.ps1

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: |
          $found = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          if ($found) {
            $found | Format-Table -AutoSize
            throw "PSScriptAnalyzer reported $($found.Count) error(s)."
          }
          Write-Host 'No errors.'
