name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # Windows is where this tool runs, so it leads the matrix. Linux is there to
    # keep the module honest about being front-end-free.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Gate (PowerShell 7)
        shell: pwsh
        run: ./tools/Invoke-Gate.ps1

  test-windows-powershell:
    # The double-click launcher runs Windows PowerShell 5.1, which is a
    # different runtime with different gaps — it gets its own run.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Gate (Windows PowerShell 5.1)
        shell: powershell
        run: ./tools/Invoke-Gate.ps1

  lint:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      - name: Analyze
        shell: pwsh
        run: ./tools/Invoke-Gate.ps1
